name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cafe_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, pdo_sqlite, sodium, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Dependency audit
        run: composer audit
      - name: Code style
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Tests (sqlite)
        run: php artisan test
      - name: Tests (MySQL, the production engine)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cafe_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  web:
    name: Web (Next.js) + shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --workspaces --audit-level=high
      - run: npm run test --workspace @cafe/locale
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint --workspace web
      - run: npm run build --workspace web
